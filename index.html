<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17231f">
<title>Treino complementar</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#17231f;--muted:#6d7972;--accent:#527b62;--accent2:#dce9df;--line:#e5eae5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:700px;margin:0 auto;padding:34px 20px 60px}
header{padding:26px 4px 18px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(30px,6vw,44px);line-height:1.05;margin:10px 0 9px;letter-spacing:-.04em}
.subtitle{color:var(--muted);margin:0;font-size:15px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 20px;margin:14px 0;box-shadow:0 8px 24px #1b34200a}
.exercise{display:flex;align-items:center;gap:14px;padding:16px 2px;border-bottom:1px solid var(--line)}
.exercise:last-child{border-bottom:0}.check{appearance:none;width:23px;height:23px;border:1.7px solid #b8c5bb;border-radius:7px;flex:none;cursor:pointer;position:relative}
.check:checked{background:var(--accent);border-color:var(--accent)}.check:checked:after{content:"✓";position:absolute;color:white;font-size:16px;font-weight:800;left:4px;top:-1px}
.info{min-width:0;flex:1}.name{font-weight:700;font-size:15px}.detail{font-size:12px;color:var(--muted);margin-top:3px}.done .name{text-decoration:line-through;color:#89948d}
.amount{font-size:13px;font-weight:800;color:var(--accent);background:var(--accent2);padding:7px 10px;border-radius:10px;white-space:nowrap}
.core-note{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 2px 12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button{border:0;border-radius:12px;padding:12px 16px;font:700 13px inherit;cursor:pointer}
.primary{background:var(--ink);color:white}.secondary{background:#e8ede8;color:var(--ink)}
.footer{text-align:center;color:var(--muted);font-size:12px;margin:22px 0 0}
</style>
</head>
<body>
<main>
<header>
  <div class="eyebrow">Seu espaço de evolução</div>
  <h1>Treino complementar</h1>
  <p class="subtitle">Marque cada exercício conforme concluir.</p>
</header>

<section class="panel" aria-label="Lista de exercícios">
  <label class="exercise"><input class="check" type="checkbox"><span class="info"><span class="name">Pistol</span></span><span class="amount">10 reps</span></label>
  <label class="exercise"><input class="check" type="checkbox"><span class="info"><span class="name">Glúteo chute</span></span><span class="amount">20 reps</span></label>
  <label class="exercise"><input class="check" type="checkbox"><span class="info"><span class="name">Elevação no bloquinho</span></span><span class="amount">10 reps</span></label>
  <label class="exercise"><input class="check" type="checkbox"><span class="info"><span class="name">Flexão</span></span><span class="amount">10 reps</span></label>
  <label class="exercise"><input class="check" type="checkbox"><span class="info"><span class="name">Pike</span></span><span class="amount">10 reps</span></label>
  <label class="exercise"><input class="check" type="checkbox"><span class="info"><span class="name">Barras</span></span><span class="amount">5 reps</span></label>
  <label class="exercise"><input class="check" type="checkbox"><span class="info"><span class="name">Toes to bar</span></span><span class="amount">5 reps</span></label>
  <label class="exercise"><input class="check" type="checkbox"><span class="info"><span class="name">L-sit</span></span><span class="amount">10 segundos</span></label>
  <label class="exercise"><input class="check" type="checkbox"><span class="info"><span class="name">Rotina core</span></span><span class="amount">1 rotina</span></label>
  <p class="core-note">Na rotina core, siga sua sequência habitual de exercícios.</p>
</section>

<div class="actions">
  <button class="primary" id="reset">Reiniciar treino</button>
  <button class="secondary" id="all">Marcar tudo como concluído</button>
</div>
<p class="footer">Treine com controle e adapte os movimentos à sua capacidade.</p>
</main>
<script>
const checks=[...document.querySelectorAll('.check')];
function update(){checks.forEach(c=>c.closest('.exercise').classList.toggle('done',c.checked))}
checks.forEach(c=>c.addEventListener('change',update));
document.getElementById('reset').addEventListener('click',()=>{checks.forEach(c=>c.checked=false);update()});
document.getElementById('all').addEventListener('click',()=>{checks.forEach(c=>c.checked=true);update()});
update();
</script>
</body>
</html>
